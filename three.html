<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三维大气模拟框架</title>
<style>
  :root {
    --bg: #070a10;
    --panel: #0d121b;
    --line: #1d2635;
    --text: #cfdaea;
    --dim: #7f8ea6;
    --accent: #4aa8ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #wrap { display: flex; height: 100%; }

  aside {
    width: 292px;
    flex: 0 0 292px;
    padding: 14px 14px 18px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  main {
    flex: 1; min-width: 0;
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: var(--line);
  }
  .cell { position: relative; background: #05070d; min-width: 0; min-height: 0; }
  .cell.xz { grid-row: 1 / span 2; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .cap {
    position: absolute; right: 10px; top: 8px;
    color: #9fb4cf; font: 11px/1.2 ui-monospace, Consolas, monospace;
    background: rgba(5,7,13,.72); padding: 2px 6px; border-radius: 3px;
    pointer-events: none;
  }

  h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; letter-spacing: .5px; }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 14px; }

  section { margin-bottom: 12px; }
  label.t { display: block; color: var(--dim); font-size: 11px; margin-bottom: 5px; letter-spacing: .3px; }

  .btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .btns button {
    flex: 1 1 0;
    min-width: 52px;
    padding: 6px 4px;
    font-size: 12px;
    color: var(--text);
    background: #131a26;
    border: 1px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
  }
  .btns button:hover { border-color: #33455f; }
  .btns button.on {
    background: #12314f;
    border-color: var(--accent);
    color: #bfe1ff;
    box-shadow: inset 0 0 0 1px rgba(74,168,255,.25);
  }

  input[type=range] { width: 100%; margin: 2px 0 10px; accent-color: var(--accent); }
  .val { color: var(--text); font-family: ui-monospace, Consolas, monospace; }

  .row { display: flex; gap: 6px; align-items: center; }
  .row button {
    flex: 1; padding: 7px 4px; font-size: 12px;
    background: #131a26; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; cursor: pointer;
  }
  .row button:hover { border-color: #33455f; }
  .chk { display: flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; flex: 0 0 auto; }
  .chk input { accent-color: var(--accent); }

  .hint {
    color: var(--dim);
    font-size: 11px;
    line-height: 1.45;
    margin-top: 6px;
    font-family: ui-monospace, Consolas, monospace;
    word-break: break-all;
  }

  .hud { margin: 0 0 12px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: #0a1018; }
  .hud .row {
    display: flex; justify-content: space-between;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px; padding: 1.5px 0;
  }
  .hud .row span { color: var(--dim); }
  .hud .row b { color: #eaf2ff; font-weight: 500; }
</style>
</head>
<body>
<div id="wrap">
  <aside>
    <h1>三维大气模拟</h1>
    <div class="sub">x–y–z · 非静力 · 浏览器内实时推进</div>

    <div class="hud" id="hud3"></div>

    <section>
      <label class="t">场景档</label>
      <div id="scales3" class="btns"></div>
      <div class="hint" id="note3"></div>
    </section>

    <section>
      <label class="t">分辨率</label>
      <div id="levels3" class="btns"></div>
      <div class="hint" id="info3"></div>
    </section>

    <section>
      <label class="t">时间倍速</label>
      <div id="speeds3" class="btns"></div>
    </section>

    <section>
      <label class="t">显示场</label>
      <div id="fields3" class="btns"></div>
    </section>

    <section>
      <label class="chk"><input type="checkbox" id="follow3" checked> 切面跟随云体</label>

      <label class="t">主视图切面（y）<span class="val" id="sliceYOut"></span></label>
      <input type="range" id="sliceY" min="0" max="31" step="1" value="16">

      <label class="t">右上看切面（x）<span class="val" id="sliceXOut"></span></label>
      <input type="range" id="sliceX" min="0" max="31" step="1" value="16">

      <label class="t">右下看层面（z）<span class="val" id="sliceZOut"></span></label>
      <input type="range" id="sliceZ" min="0" max="23" step="1" value="8">
    </section>

    <section>
      <label class="t">初始湿度 <span class="val" id="rhOut"></span></label>
      <input type="range" id="rh" min="0.2" max="1" step="0.01" value="0.78">

      <label class="t">地表感热通量 <span class="val" id="sensibleOut"></span></label>
      <input type="range" id="sensible" min="0" max="500" step="10" value="0">

      <label class="t">地表潜热通量 <span class="val" id="latentOut"></span></label>
      <input type="range" id="latent" min="0" max="300" step="10" value="0">

      <label class="t">触发热泡强度 <span class="val" id="ampOut"></span></label>
      <input type="range" id="amp" min="0.2" max="6" step="0.1" value="3">

      <label class="t">触发热泡半径 <span class="val" id="radiusOut"></span></label>
      <input type="range" id="radius" min="100" max="20000" step="50" value="2000">

      <label class="t">环境风（地面）<span class="val" id="windOut"></span></label>
      <input type="range" id="wind" min="0" max="20" step="1" value="0">

      <label class="t">风切变 <span class="val" id="shearOut"></span></label>
      <input type="range" id="shear" min="0" max="10" step="1" value="0">
      <div class="hint">单泡初值在 x、y 上是对称的，两个切面自然会像。给一点环境风或风切变，上升气流就会顺风倾斜、砧状云偏向下风方。注意本档域只有 12 km，风超过 3 m/s 时砧会绕周期边界回来；要看完整风切变对流请用「3D 中尺度」。</div>
    </section>

    <section class="row">
      <label class="chk"><input type="checkbox" id="micro3" checked> 微物理</label>
      <button id="pause3">暂停</button>
      <button id="reset3">重置</button>
    </section>

    <section class="row">
      <button id="probe3">性能探测</button>
      <button id="auto3">自动定档</button>
    </section>
    <div class="hint" id="probeOut3">点击主视图可注入热泡</div>

  </aside>

  <main>
    <div class="cell xz"><span class="cap">x–z 剖面（当前 y 切面）</span><canvas id="viewXZ"></canvas></div>
    <div class="cell"><span class="cap">y–z 剖面（当前 x 切面）</span><canvas id="viewYZ"></canvas></div>
    <div class="cell"><span class="cap">x–y 平面（当前 z 层）</span><canvas id="viewXY"></canvas></div>
  </main>
</div>
<script type="module" src="./src/three/main.js"></script>
</body>
</html>
