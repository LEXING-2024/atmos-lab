<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平面大气模拟框架</title>
<style>
  :root {
    --bg: #070a10;
    --panel: #0d121b;
    --line: #1d2635;
    --text: #cfdaea;
    --dim: #7f8ea6;
    --accent: #4aa8ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #wrap { display: flex; height: 100%; }

  aside {
    width: 292px;
    flex: 0 0 292px;
    padding: 14px 14px 18px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  main { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; letter-spacing: .5px; }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 14px; }

  section { margin-bottom: 12px; }
  label.t { display: block; color: var(--dim); font-size: 11px; margin-bottom: 5px; letter-spacing: .3px; }

  .btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .btns button {
    flex: 1 1 0;
    min-width: 52px;
    padding: 6px 4px;
    font-size: 12px;
    color: var(--text);
    background: #131a26;
    border: 1px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
  }
  .btns button:hover { border-color: #33455f; }
  .btns button.on {
    background: #12314f;
    border-color: var(--accent);
    color: #bfe1ff;
    box-shadow: inset 0 0 0 1px rgba(74,168,255,.25);
  }

  input[type=range] { width: 100%; margin: 2px 0 10px; accent-color: var(--accent); }
  .val { color: var(--text); font-family: ui-monospace, Consolas, monospace; }

  .row { display: flex; gap: 6px; align-items: center; }
  .row button {
    flex: 1; padding: 7px 4px; font-size: 12px;
    background: #131a26; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; cursor: pointer;
  }
  .row button:hover { border-color: #33455f; }
  .chk { display: flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; flex: 0 0 auto; }
  .chk input { accent-color: var(--accent); }

  .hint {
    color: var(--dim);
    font-size: 11px;
    line-height: 1.45;
    margin-top: 6px;
    font-family: ui-monospace, Consolas, monospace;
    word-break: break-all;
  }

  .hud {
    margin-top: 10px;
    border-top: 1px solid var(--line);
    padding-top: 8px;
  }
  .hud .row {
    display: flex;
    justify-content: space-between;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px;
    padding: 1.5px 0;
  }
  .hud .row span { color: var(--dim); }
  .hud .row b { color: #eaf2ff; font-weight: 500; }
</style>
</head>
<body>
<div id="wrap">
  <aside>
    <h1>平面大气模拟</h1>
    <div class="sub">x–z 剖面 · 四尺度 · 浏览器内实时推进</div>

    <section>
      <label class="t">尺度档</label>
      <div id="scales" class="btns"></div>
      <div class="hint" id="presetNote"></div>
    </section>

    <section>
      <label class="t">分辨率</label>
      <div id="levels" class="btns"></div>
      <div class="hint" id="info"></div>
    </section>

    <section>
      <label class="t">时间倍速</label>
      <div id="speeds" class="btns"></div>
    </section>

    <section>
      <label class="t">显示场</label>
      <div id="fields" class="btns"></div>
    </section>

    <section>
      <label class="t">初始湿度 <span class="val" id="rhOut"></span></label>
      <input type="range" id="rh" min="0.2" max="1" step="0.01" value="0.78">

      <label class="t">地表感热通量 <span class="val" id="sensibleOut"></span></label>
      <input type="range" id="sensible" min="0" max="500" step="10" value="0">

      <label class="t">地表潜热通量 <span class="val" id="latentOut"></span></label>
      <input type="range" id="latent" min="0" max="300" step="10" value="0">

      <label class="t">触发热泡强度 <span class="val" id="ampOut"></span></label>
      <input type="range" id="amp" min="0.5" max="6" step="0.1" value="3">

      <label class="t">触发热泡半径 <span class="val" id="radiusOut"></span></label>
      <input type="range" id="radius" min="200" max="100000" step="100" value="4000">
    </section>

    <section class="row">
      <label class="chk"><input type="checkbox" id="micro" checked> 微物理</label>
      <button id="pause">暂停</button>
      <button id="reset">重置</button>
    </section>

    <section class="row">
      <button id="probe">性能探测</button>
      <button id="auto">自动定档</button>
    </section>
    <div class="hint" id="probeOut">点击画面可注入热泡</div>

    <div class="hud" id="hud"></div>
  </aside>

  <main><canvas id="view"></canvas></main>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
